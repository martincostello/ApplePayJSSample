name: deploy

on:
  push:
    branches: [ deploy ]
  workflow_dispatch:

permissions: {}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      PUBLISH_CONTAINER: ${{ github.ref_name == 'deploy' && vars.CONTAINER_REGISTRY != '' }}

    outputs:
      container-tag: ${{ steps.publish-container.outputs.container-tag }}

    steps:

    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        filter: 'tree:0'
        persist-credentials: false
        show-progress: false

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0

    - name: Build and publish
      shell: pwsh
      env:
        TreatWarningsAsErrors: true
      run: ./build.ps1 -SkipTests

    - name: Docker log in
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      if: env.PUBLISH_CONTAINER == 'true'
      with:
        registry: ${{ vars.CONTAINER_REGISTRY }}
        username: ${{ secrets.ACR_REGISTRY_USERNAME }}
        password: ${{ secrets.ACR_REGISTRY_PASSWORD }}

    - name: Publish container
      id: publish-container
      shell: pwsh
      env:
        ContainerRegistry: ${{ env.PUBLISH_CONTAINER == 'true' && vars.CONTAINER_REGISTRY || '' }}
      run: |
        dotnet publish ./src/ApplePayJS --arch x64 --os linux -p:PublishProfile=DefaultContainer
        if (-Not [string]::IsNullOrWhiteSpace(${env:ContainerRegistry})) {
          $containerTag = "${env:ContainerRegistry}/${env:GITHUB_REPOSITORY}:github-${env:GITHUB_RUN_NUMBER}".ToLowerInvariant()
          "container-tag=${containerTag}" >> "${env:GITHUB_OUTPUT}"
        }

  deploy:
    name: deploy-production
    needs: build
    runs-on: ubuntu-24.04
    concurrency: production_environment

    environment:
      name: production
      url: ${{ vars.APPLICATION_URL }}

    permissions:
      id-token: write

    steps:

    - name: Azure log in
      uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        images: ${{ needs.build.outputs.container-tag }}

    - name: Check application health
      shell: pwsh
      env:
        APPLICATION_URL: ${{ vars.APPLICATION_URL }}
      run: |
        $delay = 10
        $limit = 10
        $success = $false
        for ($i = 0; $i -lt $limit; $i++) {
          $response = $null
          try {
            $response = Invoke-WebRequest -Uri ${env:APPLICATION_URL} -Method Get -UseBasicParsing
          } catch {
            $response = $_.Exception.Response
          }
          if (($null -ne $response) -And ($response.StatusCode -eq 200)) {
            $success = $true
            break
          }
          Start-Sleep -Seconds $delay
        }
        if (-Not $success) {
          throw "${env:APPLICATION_URL} did not return a successful status code within the time limit after $limit attempts."
        }
